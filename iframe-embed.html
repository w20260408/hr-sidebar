<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100%; min-height: 100vh; }
    iframe { width: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="sidebar-frame" src="https://w20260408.github.io/hr-sidebar/hr-sidebar-iframe-v4.html"></iframe>
  <script>
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'hr-sidebar-height') {
        var f = document.getElementById('sidebar-frame');
        if (f) f.style.height = e.data.height + 'px';
      }
    });
  </script>
</body>
</html>
