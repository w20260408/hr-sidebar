<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
    }
    iframe {
      width: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="sidebar-frame" src="https://w20260408.github.io/hr-sidebar/hr-assistant-sidebar.html"></iframe>
  <script>
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'hr-sidebar-height') {
        document.getElementById('sidebar-frame').style.height = e.data.height + 'px';
      }
    });
  </script>
</body>
</html>
