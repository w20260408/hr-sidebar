<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: auto; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f8f9fa 0%, #eef1f4 100%);
      padding: 8px;
      width: 100%;
      min-height: 100vh;
      overflow-y: auto;
    }
    .container { width: 100%; }

    /* 欢迎区 - 渐变卡片 */
    .welcome-card {
      background: linear-gradient(135deg, #FF8C00 0%, #FF6B35 100%);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(255,140,0,0.2);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .welcome-card::before {
      content: "";
      position: absolute;
      top: -10px;
      right: -10px;
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .welcome-icon { font-size: 20px; flex-shrink: 0; }
    .welcome-text { line-height: 1.2; }
    .welcome-title { font-size: 13px; font-weight: 600; }
    .welcome-subtitle { font-size: 10px; opacity: 0.85; }

    /* 输入引导 */
    .input-hint {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(102,126,234,0.2);
    }
    .input-hint-text { font-size: 11px; line-height: 1.5; }

    /* 通用卡片 */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .card-title-icon { font-size: 13px; }
    .card-title-text::before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 12px;
      background: linear-gradient(180deg, #FF8C00, #FF6B35);
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: middle;
    }

    /* 本月提醒 */
    .reminder-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .reminder-item {
      display: flex;
      align-items: center;
      padding: 7px 8px;
      background: #fafbfc;
      border-radius: 8px;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }
    .reminder-item:hover {
      background: #fff7f0;
      border-left-color: #FF8C00;
    }
    .reminder-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #FFF3E6 0%, #FFE4CC 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .reminder-content { flex: 1; min-width: 0; }
    .reminder-label { font-size: 10px; color: #8c8c8c; margin-bottom: 1px; }
    .reminder-value { font-size: 12px; color: #333; font-weight: 500; }

    /* 政策卡片 */
    .policy-list { display: flex; flex-direction: column; gap: 5px; }
    .policy-item {
      padding: 8px 10px;
      background: linear-gradient(135deg, #fafbfc 0%, #f5f6f7 100%);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .policy-item:hover {
      background: linear-gradient(135deg, #FFF7F0 0%, #FFF0E6 100%);
    }
    .policy-header { display: flex; align-items: center; margin-bottom: 4px; }
    .policy-icon { font-size: 14px; margin-right: 6px; }
    .policy-title { font-size: 12px; color: #333; font-weight: 500; }
    .policy-desc { font-size: 10px; color: #666; line-height: 1.4; }

    /* 热门话题 */
    .topic-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .topic-tag {
      padding: 4px 8px;
      background: linear-gradient(135deg, #F0F7FF 0%, #E6F0FF 100%);
      border-radius: 5px;
      font-size: 10px;
      color: #1677FF;
      transition: all 0.2s;
    }
    .topic-tag:hover {
      background: linear-gradient(135deg, #1677FF 0%, #0958D9 100%);
      color: #fff;
    }

    /* 联系HR */
    .contact-list { display: flex; flex-direction: column; gap: 5px; }
    .contact-item {
      display: flex;
      align-items: center;
      padding: 7px 8px;
      background: linear-gradient(135deg, #fafbfc 0%, #f5f6f7 100%);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .contact-item:hover {
      background: linear-gradient(135deg, #E6F4FF 0%, #D9EDFF 100%);
    }
    .contact-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #E6F4FF 0%, #D9EDFF 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .contact-label { font-size: 10px; color: #8c8c8c; }
    .contact-value { font-size: 11px; color: #333; font-weight: 500; }

    /* 底部 */
    .footer {
      text-align: center;
      padding: 8px 0 4px;
      font-size: 9px;
      color: #bfbfbf;
    }

    /* iframe 自适应高度辅助 */
    .height-probe { width: 0; height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 欢迎区 -->
    <div class="welcome-card">
      <div class="welcome-icon">👋</div>
      <div class="welcome-text">
        <div class="welcome-title">智能人事助手</div>
        <div class="welcome-subtitle">输入您的问题，我来帮您解答</div>
      </div>
    </div>

    <!-- 输入引导 -->
    <div class="input-hint">
      <div class="input-hint-text">💡 试试发送："年假怎么算"<br>"请假流程是什么"</div>
    </div>

    <!-- 本月提醒 -->
    <div class="card">
      <div class="card-title">
        <span class="card-title-icon">📌</span>
        <span class="card-title-text">本月提醒</span>
      </div>
      <div class="reminder-list">
        <div class="reminder-item">
          <div class="reminder-icon">📅</div>
          <div class="reminder-content">
            <div class="reminder-label">考勤截止</div>
            <div class="reminder-value">每月25日</div>
          </div>
        </div>
        <div class="reminder-item">
          <div class="reminder-icon">💰</div>
          <div class="reminder-content">
            <div class="reminder-label">餐补发放</div>
            <div class="reminder-value">每月15日 · 20元/天</div>
          </div>
        </div>
        <div class="reminder-item">
          <div class="reminder-icon">🎂</div>
          <div class="reminder-content">
            <div class="reminder-label">本月寿星</div>
            <div class="reminder-value">祝生日快乐！</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 政策速览 -->
    <div class="card">
      <div class="card-title">
        <span class="card-title-icon">📖</span>
        <span class="card-title-text">政策速览</span>
      </div>
      <div class="policy-list">
        <div class="policy-item">
          <div class="policy-header">
            <span class="policy-icon">🏖️</span>
            <span class="policy-title">年假政策</span>
          </div>
          <div class="policy-desc">司龄1-10年：5天 | 10年以上：10天</div>
        </div>
        <div class="policy-item">
          <div class="policy-header">
            <span class="policy-icon">⏰</span>
            <span class="policy-title">考勤时间</span>
          </div>
          <div class="policy-desc">上班 9:00 · 下班 18:00</div>
        </div>
      </div>
    </div>

    <!-- 热门话题 -->
    <div class="card">
      <div class="card-title">
        <span class="card-title-icon">🔥</span>
        <span class="card-title-text">热门话题</span>
      </div>
      <div class="topic-list">
        <span class="topic-tag">试用期考核</span>
        <span class="topic-tag">离职交接</span>
        <span class="topic-tag">社保公积金</span>
        <span class="topic-tag">加班调休</span>
        <span class="topic-tag">团建活动</span>
        <span class="topic-tag">节日福利</span>
      </div>
    </div>

    <!-- 联系HR -->
    <div class="card">
      <div class="card-title">
        <span class="card-title-icon">📞</span>
        <span class="card-title-text">联系人力运营部</span>
      </div>
      <div class="contact-list">
        <div class="contact-item">
          <div class="contact-icon">📧</div>
          <div>
            <div class="contact-label">邮箱</div>
            <div class="contact-value">hr@gnway.com</div>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-icon">📍</div>
          <div>
            <div class="contact-label">办公地点</div>
            <div class="contact-value">总部人力运营部</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <div class="footer">基于《金万维员工手册》2026年版</div>
  </div>
  <script>
    function postHeight() {
      var h = document.body.scrollHeight;
      window.parent.postMessage({ type: 'hr-sidebar-height', height: h }, '*');
    }
    window.addEventListener('load', function() { setTimeout(postHeight, 100); });
    window.addEventListener('resize', postHeight);
    new MutationObserver(postHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
  </script>
</body>
</html>
